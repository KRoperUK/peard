name: TestFlight Feedback to Issues

# Polls App Store Connect for new TestFlight beta feedback (screenshots + tester
# comments) once a day at 08:00 UTC, opens a triaged + refined GitHub issue for each
# new submission, then deletes the submission from App Store Connect so it isn't
# processed twice.
#
# A parallel poll-diagnostics job polls diagnostic signatures (hangs, excessive
# disk writes, slow launches — App Store Connect's DiagnosticSignature resource
# does not cover crashes) and opens triaged GitHub issues for each new signature.
# Both jobs share the testflight-feedback concurrency group so App Store Connect
# writes never race (the API key is rate limited).
#
# Required secrets:
#   APP_STORE_CONNECT_API_KEY_ID      App Store Connect API key id (shared with fastlane)
#   APP_STORE_CONNECT_API_ISSUER_ID   App Store Connect API issuer id
#   APP_STORE_CONNECT_API_KEY_BASE64  Base64 of the .p8 private key
#   OPENROUTER_API_KEY                OpenRouter API key
# Optional:
#   vars.ASC_APP_ID    App Store Connect app resource id (defaults to 6795739297)
#   vars.ASC_BUNDLE_ID Defaults to com.peard.app
#   vars.OPENROUTER_MODEL  OpenRouter model slug (defaults to deepseek/deepseek-v4.1-flash;
#                          use a vision-capable model so screenshots are read)
#   vars.TESTFLIGHT_SCAN_SCREENSHOTS  Set to "0"/"false" to disable the PII scan (then no
#                          screenshot is published unless PUBLISH_SCREENSHOTS forces it). On by default.
#   vars.TESTFLIGHT_PUBLISH_SCREENSHOTS  Force-publish every screenshot without scanning.
#
# The screenshot PII scan is local-only (tesseract OCR on the runner + regex/name
# checks): no extra secret, no image sent anywhere for it. It fails closed — if
# tesseract is missing or a read is low-confidence, the screenshot is withheld.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List feedback without creating issues or deleting submissions'
        required: false
        type: boolean
        default: false

concurrency:
  group: testflight-feedback
  cancel-in-progress: false

permissions:
  contents: write   # commit screenshots referenced by the issue body
  issues: write     # create issues, labels, comments

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # OCR for the local screenshot PII scan. Best-effort on purpose: if the
      # install fails the importer still runs and the scan fails closed
      # (every screenshot withheld) rather than the whole poll failing.
      - name: Install tesseract (screenshot PII scan)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Poll TestFlight feedback
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID || '6795739297' }}
          ASC_BUNDLE_ID: ${{ vars.ASC_BUNDLE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          PUBLISH_SCREENSHOTS: ${{ vars.TESTFLIGHT_PUBLISH_SCREENSHOTS }}
          SCAN_SCREENSHOTS: ${{ vars.TESTFLIGHT_SCAN_SCREENSHOTS }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const run = require('./.github/scripts/testflight-feedback.js');
            await run({ github, context, core });

  poll-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Poll TestFlight diagnostic signatures
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID || '6795739297' }}
          ASC_BUNDLE_ID: ${{ vars.ASC_BUNDLE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const run = require('./.github/scripts/testflight-diagnostics.js');
            await run({ github, context, core });
