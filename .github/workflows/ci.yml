name: CI

# Everything here was already runnable locally and only ran when somebody
# remembered. The split into three jobs is deliberate: the Go job needs no macOS
# runner and finishes in seconds, so a server-only change gets feedback without
# waiting on Xcode.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per branch or pull request, and a newer push cancels the older run —
  # on main as well as on pull requests. That includes a main run waiting for
  # the external TestFlight approval, or midway through an upload or deploy: the
  # newer commit's run does all of it again, for the newer code. The deploy and
  # TestFlight jobs also have job-level groups so two runs never do either at
  # once. CI still running for a pull request when it merges is cancelled by
  # cancel-merged-pr-ci.yml, since the merge's push runs on main instead.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build
        working-directory: server
        run: go build ./...

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Test
        working-directory: server
        run: go test ./...

      - name: Check gofmt
        working-directory: server
        # gofmt -l prints the files it would change; anything listed is a failure.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  docker:
    name: Docker image + compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose files
        # Parses and interpolates all three shapes. Catches a bad ${VAR} default,
        # a malformed override, and — because the TLS and cloudflared files use
        # `ports: !override` — a runner whose Compose predates 2.24. The last
        # check asserts the cloudflared shape publishes nothing: the tunnel is
        # meant to be the only ingress, and a stray mapping would be a second,
        # unauthenticated one. `config` does not require the external network to
        # exist, so this works on a runner with no cloudflared on it.
        run: |
          docker compose version
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.tls.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.cloudflared.yml config >/dev/null
          test -z "$(docker compose -f docker-compose.yml -f docker-compose.cloudflared.yml config --format json | jq -r '.services.server.ports // [] | length | select(. > 0)')"

      - name: Build image
        run: docker compose build

      - name: Smoke test
        # The deploy story is "migrations apply on start", so a green `go build`
        # is not enough: this proves the container actually serves. Port 8090 is
        # published by the base file, and the runner has nothing else on it.
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/health >/dev/null; then
              echo "healthy after ${i}s"
              # A collection from the Pear'd migrations: present means they ran,
              # 404 would mean the binary started against an unmigrated database.
              curl -fsS -o /dev/null -w 'posts collection: %{http_code}\n' \
                http://127.0.0.1:8090/api/collections/posts/records
              docker compose down
              exit 0
            fi
            sleep 1
          done
          echo "Container never became healthy:"
          docker compose logs
          exit 1

  core:
    name: PeardCore (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        # The newest Xcode on the image, not its default — see the script.
        run: scripts/select-newest-xcode && swift --version

      - name: Test
        working-directory: ios/PeardCore
        # PeardCore builds for macOS as well as iOS precisely so this needs no
        # simulator. The integration test skips itself without a server.
        run: swift test

  app:
    name: App (build + tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        id: xcode
        # The newest release Xcode on the image rather than its default, found by
        # version rather than by a pinned Xcode_NN.app path: those paths come and
        # go with the runner image, and a hard-coded one turns an image update
        # into a red build for a reason that has nothing to do with the code.
        # Tests build with the SDK that ships.
        run: |
          scripts/select-newest-xcode
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -s ' ')" >> "$GITHUB_OUTPUT"

      # The first simulator command after switching Xcode starts the simulator
      # service and loads its runtime, which took nearly two minutes on a fresh
      # runner — and then the simulator still has to boot. None of that needs the
      # app, so it all happens in the background while the app compiles, and the
      # build below targets a generic simulator so it does not wait for a device.
      - name: Start a simulator (background)
        run: |
          # Single-quoted on purpose: the variables belong to the background shell.
          # shellcheck disable=SC2016
          nohup bash -c '
            id=$(scripts/pick-simulator) || exit 1
            echo "$id" > "$RUNNER_TEMP/sim-id"
            xcrun simctl boot "$id"
          ' > "$RUNNER_TEMP/sim.log" 2>&1 &

      # Clang's module cache: the SDK's modules, precompiled. The same for every
      # run on one Xcode, so it is keyed on nothing else, and rebuilding it is a
      # fixed cost every cold run otherwise pays.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/build/ModuleCache.noindex
          key: module-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}

      - name: Install XcodeGen
        # ios/Peard.xcodeproj is generated from ios/project.yml and is not
        # committed, so this is a hard requirement rather than a convenience.
        run: brew install xcodegen

      - name: Generate project
        run: make project

      # Everything CI does not need is off: coverage (instrumentation slows both
      # the build and the run, and nothing reads it here — the scheme still
      # gathers it locally), the index store (nobody jumps to a definition on a
      # runner), and Intel slices (the runner and its simulator are arm64, and a
      # generic destination would otherwise build both).
      - name: Build for testing
        run: |
          xcodebuild -project ios/Peard.xcodeproj -scheme Peard \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/build \
            -enableCodeCoverage NO \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            build-for-testing

      - name: Wait for the simulator
        id: sim
        timeout-minutes: 10
        run: |
          until [ -s "$RUNNER_TEMP/sim-id" ]; do
            if ! pgrep -f "simctl boot|pick-simulator" >/dev/null && [ ! -s "$RUNNER_TEMP/sim-id" ]; then
              echo "No simulator was picked:"; cat "$RUNNER_TEMP/sim.log"
              xcrun simctl list devices available
              exit 1
            fi
            sleep 2
          done
          id=$(cat "$RUNNER_TEMP/sim-id")
          echo "Using $id"
          xcrun simctl bootstatus "$id" -b
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # The whole suite, against what was just built. One simulator: parallel
      # testing clones it, which costs more than it saves for a suite that runs
      # in seconds.
      - name: App-target tests
        run: |
          xcodebuild -project ios/Peard.xcodeproj -scheme Peard \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath ios/build \
            -resultBundlePath ios/build/PeardTests.xcresult \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            test-without-building

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcresult
          path: ios/build/PeardTests.xcresult
          retention-days: 7

  testflight:
    name: TestFlight (internal)
    runs-on: macos-15
    # The same gate as the server deploy: a build only goes to testers from a
    # commit on main whose every check passed.
    needs: [server, docker, core, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: testflight-internal
    concurrency:
      group: testflight-internal
      cancel-in-progress: false
    outputs:
      build_number: ${{ steps.upload.outputs.build_number }}
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      # Skipped with a warning, not failed, until the secrets exist: a red main
      # for a setup step nobody has done yet would teach people to ignore red.
      - name: Credentials
        id: creds
        run: |
          if [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_API_ISSUER_ID" ] && [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=TestFlight skipped::Add APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID and APP_STORE_CONNECT_API_KEY_BASE64 as secrets (repository or the testflight-internal environment) to upload builds from main."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.ready == 'true'

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        if: steps.creds.outputs.ready == 'true'
        with:
          # fastlane's supported range; the Gemfile pins fastlane itself.
          ruby-version: "3.3"
          bundler-cache: true

      - name: Toolchain
        if: steps.creds.outputs.ready == 'true'
        # App Store Connect refuses anything built with an SDK older than iOS
        # 26, and the image's default Xcode is older than that.
        run: scripts/select-newest-xcode

      - name: Install XcodeGen
        if: steps.creds.outputs.ready == 'true'
        run: brew install xcodegen

      - name: Archive and upload
        id: upload
        if: steps.creds.outputs.ready == 'true'
        # Every upload needs a build number App Store Connect has not seen. The
        # upload time in Unix seconds: it only goes up, and it is the scheme the
        # builds uploaded by hand already use (build 1785639368 was one), so CI's
        # numbers carry on from them rather than starting below.
        run: |
          PEARD_BUILD_NUMBER=$(date +%s)
          export PEARD_BUILD_NUMBER
          echo "Build number $PEARD_BUILD_NUMBER"
          bundle exec fastlane beta
          echo "build_number=$PEARD_BUILD_NUMBER" >> "$GITHUB_OUTPUT"

  testflight-external:
    name: TestFlight (external)
    runs-on: macos-15
    needs: testflight
    # Only once the internal job actually uploaded something.
    if: needs.testflight.outputs.build_number != ''
    # The approval. The testflight-external environment requires a reviewer, so
    # the run pauses here until somebody approves it in the Actions tab. The
    # next push to main cancels an unapproved one, and its own run offers the
    # newer build instead. Nothing is rebuilt: the build internal testers have
    # is the one that goes out.
    environment:
      name: testflight-external
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      PEARD_TESTFLIGHT_EXTERNAL_GROUP: ${{ vars.PEARD_TESTFLIGHT_EXTERNAL_GROUP }}
      PEARD_PROMOTE_BUILD: ${{ needs.testflight.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          # fastlane's supported range; the Gemfile pins fastlane itself.
          ruby-version: "3.3"
          bundler-cache: true

      # Adds that build to the external group, waiting for App Store Connect
      # to finish processing it if it has not yet. The first build of each
      # version is submitted for Beta App Review on the way.
      - name: Send to external testers
        run: bundle exec fastlane promote_external

  deploy:
    name: Deploy server
    runs-on: ubuntu-latest
    # Every check, not only the two that judge the server.
    #
    # This used to be [server, docker], on the argument that a broken Xcode build
    # cannot make a Go binary wrong. True in isolation, and the wrong unit: the
    # thing being deployed is a commit on main, and the app and the server ship
    # against each other. Deploying a server from a commit whose app tests are
    # red is how the two drift — routes live that the app was reverted from, or
    # the reverse — and that drift surfaces as requests failing for no stated
    # reason, which is the failure this job was added to end.
    #
    # The cost is real and worth naming: a server-only fix now waits on a macOS
    # job that takes six minutes and cannot have broken it. The mitigation is
    # that the trigger below is scoped — an iOS-only push reaches this job and
    # deliberately rebuilds nothing — so the wait is paid on the pushes that
    # actually change what is running.
    needs: [server, docker, core, app]

    # Records the deploy against a named environment, so the Environments tab
    # carries the history and the current revision instead of it living only in
    # this job's log. It is also where a required reviewer or a wait timer would
    # be configured, and where the Komodo secret and URL can be scoped when this
    # stops being the only thing that deploys.
    environment:
      name: production
      url: https://peard.kroper.uk
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Pushes to main only. A pull_request run must never deploy — the code has
    # not landed — and a workflow_dispatch on a branch would deploy whatever
    # Komodo pulls from main, which is not what the person who pressed it meant.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the range below is diffable however many commits
          # the push carried.
          fetch-depth: 0

      # Whether this push can be expected to produce a *different image*, which
      # decides how the verification below reads a `built_at` that has not moved.
      # Docker's cache is content-addressed, so a push that leaves server/ and
      # the Dockerfile alone rebuilds nothing and stamps no new build time — and
      # demanding one would fail this job on every iOS-only commit. Compose files
      # are deliberately out: they can change the container without changing the
      # image.
      - name: Does this push rebuild the server?
        id: scope
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            # A force-push, a first push, or history that no longer contains the
            # old head. Assume the image changed: a spurious failure here is
            # noisy, and the alternative is a real one going unnoticed.
            echo "No usable previous commit to diff against — assuming a rebuild."
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$before" "$GITHUB_SHA")
          echo "Changed in this push:"
          echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^(server/|Dockerfile)'; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi

      # Komodo was pulling commits and then stopping. It does deploy when asked,
      # but nothing was asking: 01871fc sat undeployed for about fifteen hours,
      # and before that the app shipped routes the running server did not have,
      # which surfaced as requests failing for no stated reason. This is the ask.
      - name: Trigger Komodo deploy
        env:
          # Repository secret: the key Komodo signs against. Repository variable:
          # the listener URL, which carries the stack id and the hostname of a
          # Komodo that is not otherwise advertised — out of a public workflow
          # file on purpose.
          KOMODO_STACK_WEBHOOK_SECRET: ${{ secrets.KOMODO_STACK_WEBHOOK_SECRET }}
          URL: ${{ vars.KOMODO_STACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          # Named separately rather than "one of these is missing": a deploy that
          # silently does nothing is the exact failure this job exists to end, so
          # it has to say which half of the setup is absent.
          if [ -z "${KOMODO_STACK_WEBHOOK_SECRET}" ]; then
            echo "Repository secret KOMODO_STACK_WEBHOOK_SECRET is not set — nothing would be deployed."
            exit 1
          fi
          if [ -z "${URL}" ]; then
            echo "Repository variable KOMODO_STACK_WEBHOOK_URL is not set — nothing would be deployed."
            exit 1
          fi

          # Komodo's GitHub listener expects a push payload and checks `ref`
          # against the branch configured on the stack. The other fields are
          # there because a listener that grew a required field would otherwise
          # start rejecting us with a deserialisation error rather than a
          # signature one, which is a much harder thing to read in a log.
          body=$(printf '{"ref":"refs/heads/main","after":"%s","repository":{"full_name":"%s"}}' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY")

          # Signed with python rather than `openssl dgst -hmac "$KEY"`, which
          # puts the key in argv where anything on the box can read it. Over the
          # exact bytes sent below, or the signature will not match.
          sig=$(printf '%s' "$body" | python3 -c \
            'import hashlib, hmac, os, sys; print(hmac.new(os.environb[b"KOMODO_STACK_WEBHOOK_SECRET"], sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')

          curl -fsS --retry 3 --retry-connrefused --max-time 30 \
            -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data "$body"
          echo "Deploy requested."

      # A 200 from the listener means Komodo accepted the request, not that the
      # stack came back up — and "accepted" was never the part that was failing.
      # `built_at` is stamped into the binary at image build time, so it moving
      # is proof that a new image is serving traffic rather than that somebody
      # was asked nicely.
      - name: Wait for the new build to answer
        if: steps.scope.outputs.rebuild == 'true'
        env:
          STATUS_URL: https://peard.kroper.uk/api/peard/status
        run: |
          set -euo pipefail
          # Retried: a blip here would fail the job *after* the deploy was
          # already requested, which is the most confusing way for it to go red.
          before=$(curl -fsS --retry 3 --max-time 15 "$STATUS_URL" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["built_at"])')
          echo "Currently serving a build from $before"

          for _ in $(seq 1 40); do
            sleep 10
            # A failed poll counts as "unchanged" rather than aborting: the
            # server is briefly unreachable while it is being replaced, which is
            # the normal middle of a successful deploy.
            now=$(curl -fsS --max-time 15 "$STATUS_URL" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["built_at"])' 2>/dev/null || echo "$before")
            if [ "$now" != "$before" ]; then
              echo "Now serving a build from $now"
              exit 0
            fi
          done

          echo "Still serving the build from $before after about seven minutes."
          echo "Komodo accepted the webhook, so the failure is on its side — check the"
          echo "stack's logs for the branch it watches and whether the image build failed."
          exit 1

      - name: Nothing to verify
        if: steps.scope.outputs.rebuild != 'true'
        run: |
          echo "This push changed nothing under server/ or the Dockerfile, so it is not"
          echo "expected to produce a new image, and a build time that stays put proves"
          echo "nothing either way. Komodo has been asked to deploy regardless, which"
          echo "keeps its checkout level with main and picks up anything a previous"
          echo "push left undeployed."
