name: TestFlight Feedback Cleanup

# When a testflight-feedback issue is closed, purge its screenshots from the
# testflight-feedback-assets branch by rebuilding that branch as a single orphan
# commit (history never grows; removed blobs become unreferenced and are
# garbage-collected by GitHub). Shares the poll's concurrency group so branch
# rewrites never race the daily poll.

on:
  issues:
    types: [closed]

concurrency:
  group: testflight-feedback
  cancel-in-progress: false

permissions:
  contents: write   # rewrite the assets branch
  issues: read

jobs:
  cleanup:
    if: contains(github.event.issue.labels.*.name, 'testflight-feedback')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Purge closed issue screenshots
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = require('./.github/scripts/testflight-feedback-cleanup.js');
            await run({ github, context, core });
