# Pear'd Xcode project, generated by XcodeGen.
#
#     make project     # or: cd ios && xcodegen generate
#
# ios/Peard.xcodeproj is NOT committed — it is derived from this file. Add or
# rename a source file and the next generate picks it up; there is no file list
# to maintain and no pbxproj merge conflicts.
#
# Anything a developer would otherwise set in Xcode's build-settings editor
# belongs here, because the editor's changes are thrown away on regenerate.

name: Peard

options:
  bundleIdPrefix: com.peard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Keep XcodeGen's default warning/analyser presets (they match the Xcode
  # template the hand-maintained project was derived from) and layer the
  # project's own settings on top.
  settingPresets: all
  xcodeVersion: "2600"

configs:
  Debug: debug
  Release: release

# One configuration file per build configuration, because the server URL is
# baked into Info.plist at build time and the two differ: Debug talks to a local
# server over HTTP, Release to https://peard.kroper.uk. Both include
# Config.example.xcconfig, which holds the shared settings and ends with
# `#include? "Config.xcconfig"` so a developer's git-ignored copy overrides them
# without editing anything tracked.
configFiles:
  Debug: Config.debug.xcconfig
  Release: Config.release.xcconfig

packages:
  PeardCore:
    path: PeardCore

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    MTL_FAST_MATH: YES
    SWIFT_VERSION: "5.0"
    # Treat warnings as errors nowhere, but do surface everything: the tree
    # builds clean today and CI checks that it stays that way.
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

targets:

  Peard:
    type: application
    platform: iOS
    sources:
      - path: Peard
        excludes:
          - Info.plist
          - Info-Debug.plist
          - Peard-Debug.entitlements
          - Peard-Release.entitlements
      # Referenced by build settings rather than compiled or copied, but kept
      # visible in the navigator.
      - path: Peard/Info.plist
        buildPhase: none
      - path: Peard/Info-Debug.plist
        buildPhase: none
      - path: Peard/Peard-Debug.entitlements
        buildPhase: none
      - path: Peard/Peard-Release.entitlements
        buildPhase: none
      # Palette shared with the widget.
      - path: Shared/Colors.xcassets
    dependencies:
      - package: PeardCore
      - target: PearWidgetExtension
      - target: PearMessagesExtension
      - target: PearNotificationServiceExtension
      - target: PearShareExtension
      # The watch app (issue #8), embedded so it ships with the iPhone app and
      # installs on a paired watch from it.
      - target: PeardWatch
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Alternate icons, chosen at runtime with setAlternateIconName(_:).
        # They have to be named here as well as existing in the catalogue:
        # without INCLUDE_ALL_APPICON_ASSETS the compiler strips every set that
        # is not the primary, and the call then fails at runtime with a message
        # about an icon that is plainly on disk.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconAmber AppIconBlush AppIconInk
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 72Q6R744M4
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        # Matches the 1.0 version record in App Store Connect. TestFlight groups
        # builds by this string, so a mismatch produces a train that the 1.0
        # submission cannot select a build from. Bump the build number, not this,
        # between uploads of the same version — see PEARD_BUILD_NUMBER.
        MARKETING_VERSION: "1.0.0" # x-release-please-version
        PRODUCT_BUNDLE_IDENTIFIER: com.peard.app
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
      configs:
        # Debug adds an App Transport Security exception for a local server and
        # carries the development APS environment; Release carries production.
        Debug:
          INFOPLIST_FILE: Peard/Info-Debug.plist
          CODE_SIGN_ENTITLEMENTS: Peard/Peard-Debug.entitlements
        Release:
          INFOPLIST_FILE: Peard/Info.plist
          CODE_SIGN_ENTITLEMENTS: Peard/Peard-Release.entitlements

  PearWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PearWidget
        excludes:
          - Info.plist
          - PearWidget.entitlements
      - path: PearWidget/Info.plist
        buildPhase: none
      - path: PearWidget/PearWidget.entitlements
        buildPhase: none
      - path: Shared/Colors.xcassets
    dependencies:
      - package: PeardCore
      # Explicit, even though PearWidget.swift imports it. Swift resolves the
      # module from the SDK without a link, but `appintentsmetadataprocessor` only
      # runs when the target has an AppIntents.framework dependency — and without
      # it the appex ships no Metadata.appintents bundle, so the configuration
      # intent and the buttons' LogMomentIntent are invisible to the system. The
      # build stays green either way, which is what makes it worth stating here.
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: PearWidget/PearWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 72Q6R744M4
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PearWidget/Info.plist
        # Must equal the app's MARKETING_VERSION: App Store validation rejects an
        # appex whose short version differs from its host.
        MARKETING_VERSION: "1.0.0" # x-release-please-version
        PRODUCT_BUNDLE_IDENTIFIER: com.peard.app.PearWidget
        PRODUCT_NAME: $(TARGET_NAME)
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  PearMessagesExtension:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: PearMessages
        excludes:
          - Info.plist
          - PearMessages.entitlements
      - path: PearMessages/Info.plist
        buildPhase: none
      - path: PearMessages/PearMessages.entitlements
        buildPhase: none
      # PearMessages/Assets.xcassets is picked up by the directory above. Its
      # "iMessage App Icon" set is entirely generated — see
      # ios/Tools/GenerateMessagesIcon.swift, and note that it is the classic
      # explicit per-idiom, per-scale set rather than the single-size
      # "universal" form the main AppIcon uses: App Store Connect rejects the
      # universal form for a Messages extension ("Missing App Icon... must be
      # 148x110 pixels"), and the build stays green either way, so nothing but
      # an upload catches it.
      - path: Shared/Colors.xcassets
    dependencies:
      - package: PeardCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
        CODE_SIGN_ENTITLEMENTS: PearMessages/PearMessages.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 72Q6R744M4
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PearMessages/Info.plist
        # Must equal the app's MARKETING_VERSION: App Store validation rejects an
        # appex whose short version differs from its host.
        MARKETING_VERSION: "1.0.0" # x-release-please-version
        PRODUCT_BUNDLE_IDENTIFIER: com.peard.app.PearMessages
        PRODUCT_NAME: $(TARGET_NAME)
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # Attaches the photo to a photo moment's notification. No PeardCore: a
  # notification service extension runs in about 24 MB, and all it does is one
  # download. See PearNotificationService/NotificationService.swift.
  PearNotificationServiceExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PearNotificationService
        excludes:
          - Info.plist
          - PearNotificationService.entitlements
      - path: PearNotificationService/Info.plist
        buildPhase: none
      - path: PearNotificationService/PearNotificationService.entitlements
        buildPhase: none
    settings:
      base:
        # The App Group, to leave each photo where the Live Activity can find it.
        CODE_SIGN_ENTITLEMENTS: PearNotificationService/PearNotificationService.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 72Q6R744M4
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PearNotificationService/Info.plist
        # Must equal the app's MARKETING_VERSION, like every other appex.
        MARKETING_VERSION: "1.0.0" # x-release-please-version
        PRODUCT_BUNDLE_IDENTIFIER: com.peard.app.PearNotificationService
        PRODUCT_NAME: $(TARGET_NAME)
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # Sends a photo from the share sheet. It never uploads: the photo and the
  # chosen moment go into the App Group inbox, and the app's send queue uploads
  # them — see PearShare/ShareModel.swift and MomentInbox.
  PearShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PearShare
        excludes:
          - Info.plist
          - PearShare.entitlements
      - path: PearShare/Info.plist
        buildPhase: none
      - path: PearShare/PearShare.entitlements
        buildPhase: none
      # The app's own square renderer, compiled in here too, so a shared photo
      # is squared by exactly the code — and at exactly the size and quality —
      # that squares one sent from inside the app.
      - path: Peard/PhotoSquare.swift
      - path: Shared/Colors.xcassets
    dependencies:
      - package: PeardCore
    settings:
      base:
        # The App Group, for the inbox the photo is handed over through.
        CODE_SIGN_ENTITLEMENTS: PearShare/PearShare.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 72Q6R744M4
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PearShare/Info.plist
        # Must equal the app's MARKETING_VERSION, like every other appex.
        MARKETING_VERSION: "1.0.0" # x-release-please-version
        PRODUCT_BUNDLE_IDENTIFIER: com.peard.app.PearShare
        PRODUCT_NAME: $(TARGET_NAME)
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # The watch app (issue #8): the moment grid and nothing else. It logs with
  # the widget token, which the phone hands over through WatchConnectivity
  # (Peard/WatchSync.swift), so signing in stays on the phone.
  PeardWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: PeardWatch
        excludes:
          - Info-Debug.plist
          - PeardWatch.entitlements
      - path: PeardWatch/Info-Debug.plist
        buildPhase: none
      - path: PeardWatch/PeardWatch.entitlements
        buildPhase: none
      - path: Shared/Colors.xcassets
    dependencies:
      - package: PeardCore
      - target: PeardWatchWidgets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PeardWatch/PeardWatch.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 72Q6R744M4
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pear'd
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.peard.app
        MARKETING_VERSION: "1.0.0" # x-release-please-version
        PRODUCT_BUNDLE_IDENTIFIER: com.peard.app.watchkitapp
        PRODUCT_NAME: $(TARGET_NAME)
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "4"
      configs:
        # A local server over plain HTTP, as the app's own Debug plist allows.
        Debug:
          INFOPLIST_FILE: PeardWatch/Info-Debug.plist

  # Watch-face complications, drawn from the same feed and LockScreenSummary as
  # the iPhone's Lock Screen widgets.
  PeardWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: PeardWatchWidgets
        excludes:
          - Info.plist
          - PeardWatchWidgets.entitlements
      - path: PeardWatchWidgets/Info.plist
        buildPhase: none
      - path: PeardWatchWidgets/PeardWatchWidgets.entitlements
        buildPhase: none
    dependencies:
      - package: PeardCore
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: PeardWatchWidgets/PeardWatchWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 72Q6R744M4
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PeardWatchWidgets/Info.plist
        # Must equal the watch app's, as an appex's must equal its host's.
        MARKETING_VERSION: "1.0.0" # x-release-please-version
        PRODUCT_BUNDLE_IDENTIFIER: com.peard.app.watchkitapp.complications
        PRODUCT_NAME: $(TARGET_NAME)
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "4"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # Logic that needs UIKit/SwiftUI or the app's own types, so it cannot live in
  # PeardCore's `swift test` suite: the quick-send countdown, the hold-on-note
  # rule, and the phase routing.
  PeardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PeardTests
      # The Messages tray's state, compiled into the tests as well as into the
      # extension. An app-extension target cannot host a unit-test bundle, so
      # the alternative was leaving the one piece of logic in that extension —
      # which connection a moment logs into — with nothing covering it.
      # Deliberately only the model: it imports PeardCore and nothing from the
      # Messages framework, which is what makes this possible at all.
      - path: PearMessages/MomentTrayModel.swift
      # Same reason: the notification service extension cannot host tests, and
      # the simulator's `simctl push` never runs a service extension at all, so
      # this is the only place its download-and-attach is exercised.
      - path: PearNotificationService/NotificationService.swift
    dependencies:
      - target: Peard
      - package: PeardCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.peard.app.PeardTests
        TARGETED_DEVICE_FAMILY: "1,2"

  # The launch smoke test: privacy consent, sign-in, and an invite link, driven
  # through the real UI. Its own target because XCUITests run in a separate
  # runner process against the installed app, and because it is slow enough to
  # keep out of the unit-test loop — `make test-app` and `fastlane test_app`
  # skip it, `make test-ui` and `fastlane test_ui` run only it. No server:
  # everything it touches happens before sign-in.
  PeardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PeardUITests
    dependencies:
      - target: Peard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.peard.app.PeardUITests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Peard

schemes:

  Peard:
    build:
      targets:
        Peard: all
        PearWidgetExtension: all
        PearMessagesExtension: all
        PearShareExtension: all
        PeardTests: [test]
        PeardUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Peard
      # Both, so Xcode's Test action and `-only-testing:PeardUITests` find the
      # UI tests. The command-line entry points choose between them rather than
      # running the lot: see test-app and test-ui in the Makefile.
      targets:
        - PeardTests
        - PeardUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  PeardWatch:
    build:
      targets:
        PeardWatch: all
        PeardWatchWidgets: all
    run:
      config: Debug
    archive:
      config: Release
