version: 2
updates:

  # The server image's base images (golang, alpine). The Dockerfile is in
  # server/: pointed at the root, this found nothing and failed every run.
  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        patterns: ["*"]

  # The server's Go modules — PocketBase and everything it pulls in. govulncheck
  # in CI says when one of them has a known vulnerability; this is what opens
  # the pull request that fixes it.
  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "ruby"
    groups:
      bundler:
        patterns: ["*"]

  # GitHub Actions — keeps the SHA-pinned actions in .github/workflows current.
  # Batched into one weekly PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns: ["*"]
