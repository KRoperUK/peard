# Pear'd Xcode project, generated by XcodeGen.
#
#     make project     # or: cd ios && xcodegen generate
#
# ios/Peard.xcodeproj is NOT committed — it is derived from this file. Add or
# rename a source file and the next generate picks it up; there is no file list
# to maintain and no pbxproj merge conflicts.
#
# Anything a developer would otherwise set in Xcode's build-settings editor
# belongs here, because the editor's changes are thrown away on regenerate.

name: Peard

options:
  bundleIdPrefix: com.peard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Keep XcodeGen's default warning/analyser presets (they match the Xcode
  # template the hand-maintained project was derived from) and layer the
  # project's own settings on top.
  settingPresets: all
  xcodeVersion: "2600"

configs:
  Debug: debug
  Release: release

# Base configuration for both configs. Config.example.xcconfig holds the
# defaults and ends with `#include? "Config.xcconfig"`, so a developer's
# git-ignored copy overrides them without editing anything tracked.
configFiles:
  Debug: Config.example.xcconfig
  Release: Config.example.xcconfig

packages:
  PeardCore:
    path: PeardCore

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    MTL_FAST_MATH: YES
    SWIFT_VERSION: "5.0"
    # Treat warnings as errors nowhere, but do surface everything: the tree
    # builds clean today and CI checks that it stays that way.
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

targets:

  Peard:
    type: application
    platform: iOS
    sources:
      - path: Peard
        excludes:
          - Info.plist
          - Info-Debug.plist
          - Peard-Debug.entitlements
          - Peard-Release.entitlements
      # Referenced by build settings rather than compiled or copied, but kept
      # visible in the navigator.
      - path: Peard/Info.plist
        buildPhase: none
      - path: Peard/Info-Debug.plist
        buildPhase: none
      - path: Peard/Peard-Debug.entitlements
        buildPhase: none
      - path: Peard/Peard-Release.entitlements
        buildPhase: none
      # Palette shared with the widget.
      - path: Shared/Colors.xcassets
    dependencies:
      - package: PeardCore
      - target: PearWidgetExtension
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 72Q6R744M4
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.peard.app
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
      configs:
        # Debug adds an App Transport Security exception for a local server and
        # carries the development APS environment; Release carries production.
        Debug:
          INFOPLIST_FILE: Peard/Info-Debug.plist
          CODE_SIGN_ENTITLEMENTS: Peard/Peard-Debug.entitlements
        Release:
          INFOPLIST_FILE: Peard/Info.plist
          CODE_SIGN_ENTITLEMENTS: Peard/Peard-Release.entitlements

  PearWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PearWidget
        excludes:
          - Info.plist
          - PearWidget.entitlements
      - path: PearWidget/Info.plist
        buildPhase: none
      - path: PearWidget/PearWidget.entitlements
        buildPhase: none
      - path: Shared/Colors.xcassets
    dependencies:
      - package: PeardCore
      # Explicit, even though PearWidget.swift imports it. Swift resolves the
      # module from the SDK without a link, but `appintentsmetadataprocessor` only
      # runs when the target has an AppIntents.framework dependency — and without
      # it the appex ships no Metadata.appintents bundle, so the configuration
      # intent and the buttons' LogMomentIntent are invisible to the system. The
      # build stays green either way, which is what makes it worth stating here.
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: PearWidget/PearWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 72Q6R744M4
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PearWidget/Info.plist
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.peard.app.PearWidget
        PRODUCT_NAME: $(TARGET_NAME)
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # Logic that needs UIKit/SwiftUI or the app's own types, so it cannot live in
  # PeardCore's `swift test` suite: the quick-send countdown, the hold-on-note
  # rule, and the phase routing.
  PeardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PeardTests
    dependencies:
      - target: Peard
      - package: PeardCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.peard.app.PeardTests
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:

  Peard:
    build:
      targets:
        Peard: all
        PearWidgetExtension: all
        PeardTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Peard
      targets:
        - PeardTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
